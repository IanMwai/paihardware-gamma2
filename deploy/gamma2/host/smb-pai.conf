# Samba share that hands the run folder to the VM. Append to /etc/samba/smb.conf
# (or drop in via `include = /etc/samba/smb-pai.conf`), then `sudo systemctl
# restart smbd`.
#
# The share is only reachable on libvirt's NAT bridge (virbr0), so guest access
# is acceptable here: the Windows VM mounts it from a non-interactive SSH
# session, where stored credentials are not available. Everything the VM
# writes is owned by the `pai` service user, group `pai`, group-writable, so
# any gamma2 user in group `pai` (and the STOP file `pai stop` writes) can touch it.

[global]
    interfaces = lo virbr0
    bind interfaces only = yes
    map to guest = Bad User
    server min protocol = SMB2

[pai]
    path = /srv/pai
    comment = PAI GPU power runs (written by the daqwin VM)
    browseable = yes
    read only = no
    guest ok = yes
    force user = pai
    force group = pai
    create mask = 0664
    directory mask = 2775
    hosts allow = 192.168.122.
    hosts deny = ALL
    # Acquisition rewrites latest.npz every ~100 ms; keep SMB from caching
    # stale metadata so the dashboard on gamma2 sees fresh files.
    strict sync = no
    oplocks = no
    level2 oplocks = no
