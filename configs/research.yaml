# Preserve each power sample. Smooth during later analysis, not collection.
sample_rate_hz: 10000
chunk_size: 1000
measurement_name: GPU Power Measurement Test
channels:
  device: Dev1
  terminal: RSE
  min_v: -0.5
  max_v: 3.5
  gpus:
  - label: GPU1
    voltage: ai0
    current: ai1
    voltage_scale: 4.741144
    current_sign: 1
  - label: GPU2
    voltage: ai2
    current: ai3
    voltage_scale: 4.61189
    current_sign: 1
  - label: GPU3
    voltage: ai4
    current: ai5
    voltage_scale: 4.61189
    current_sign: 1
  - label: GPU4
    voltage: ai6
    current: ai7
    voltage_scale: 4.606657
    current_sign: 1
scaling:
  current_scale: 12.5
processing:
  voltage_delay_samples: 0
  current_delay_samples: 0
  power_average_samples: 1
display:
  window_sec: 60
  refresh_ms: 30
  stale_after_sec: 2
  fullscreen: false
  y_limits:
    voltage:
    - 11.5
    - 13.0
    current:
    - -1.0
    - 15.0
    power:
    - -10.0
    - 180.0
logging:
  chunk_duration_sec: 60
  file_prefix: nidaq
  format: csv
  queue_blocks: 200
  compress: true
remote:
  enabled: true
  remote_run_root: pai_runs
  nvml_interval_ms: 100
  connect_timeout_sec: 10
storage:
  output_root: output
  archive_root: /n/holylabs/lexie_lab/Lab/gpu_power_logs
  retention_days: 14
  globus:
    local_endpoint_id: ''
    remote_endpoint_id: 1156ed9e-6984-11ea-af52-0201714f6eab
    auto_push: true
    deadline_days: 7
